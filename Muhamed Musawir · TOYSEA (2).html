<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhamed Musawir · TOYSEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e1f3d; --navy-2:#16305c; --sky:#4db3e6; --red:#d12b4b; --yellow:#f5e02d; --green:#76c94b; --pink:#ee0e8e;
  --ink:#0e1f3d; --muted:#5b6882; --line:#e7ebf3; --paper:#ffffff; --tint:#f5f8fd;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
  background:
    radial-gradient(circle at 12% 18%, rgba(77,179,230,.28) 0 90px, transparent 91px),
    radial-gradient(circle at 90% 85%, rgba(238,14,142,.22) 0 110px, transparent 111px),
    radial-gradient(circle at 82% 12%, rgba(245,224,45,.25) 0 60px, transparent 61px),
    radial-gradient(circle at 8% 88%, rgba(118,201,75,.22) 0 70px, transparent 71px),
    linear-gradient(160deg,#0e1f3d,#16305c 60%,#0e1f3d);
  display:flex; align-items:center; justify-content:center; padding:28px 16px;
}
.card{
  width:100%; max-width:880px; background:var(--paper); border-radius:32px; overflow:hidden;
  box-shadow:0 30px 70px rgba(2,10,30,.45), 0 4px 12px rgba(2,10,30,.25);
  display:grid; grid-template-columns:1.25fr 1fr;
}
.stripe{grid-column:1/-1; height:8px; background:linear-gradient(90deg,var(--sky) 0 20%,var(--red) 20% 40%,var(--yellow) 40% 60%,var(--green) 60% 80%,var(--pink) 80%);}
.main{padding:16px 36px 36px; display:flex; flex-direction:column; gap:22px}
.logo{height:215px; width:auto; align-self:center; margin:-8px 0 -14px; display:block}
.idwrap{display:flex; align-items:center; gap:20px}
.photo{flex:none; width:118px; height:118px; border-radius:50%; object-fit:cover; border:4px solid #fff; box-shadow:0 0 0 4px var(--sky), 0 0 0 8px var(--yellow), 0 10px 24px rgba(14,31,61,.25)}
@media (max-width:720px){.photo{width:92px;height:92px}.idwrap{gap:16px}}
.ar{font-family:"Cairo","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif; font-weight:600; font-size:clamp(18px,3vw,22px); line-height:1.3; color:var(--muted); text-align:left; margin:-4px 0 12px}
.id h1{font-family:"Fredoka","Nunito",system-ui,sans-serif; font-weight:600; font-size:clamp(26px,4.6vw,38px); line-height:1.1; margin:0 0 12px; letter-spacing:.03em; text-transform:uppercase}
.role{display:inline-flex; align-items:center; gap:8px; background:var(--tint); border:1px solid var(--line); border-radius:999px; padding:6px 14px 6px 10px; font-weight:700; font-size:14px; color:var(--navy-2)}
.role i{width:10px;height:10px;border-radius:50%;background:var(--red);display:block}
.rows{display:flex; flex-direction:column; gap:10px}
.row{display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit; padding:10px 12px; margin:0 -12px; border-radius:16px; transition:background .15s}
.row:hover,.row:focus-visible{background:var(--tint); outline:none}
.ico{flex:none; width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:#fff}
.ico svg{width:20px;height:20px}
.row small{display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.row span.v{font-weight:700; font-size:16px; overflow-wrap:anywhere}
.socials{display:flex; gap:10px; flex-wrap:wrap}
.soc{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-weight:700; font-size:14px; color:var(--navy); background:var(--tint); border:1px solid var(--line); padding:9px 14px 9px 10px; border-radius:999px; transition:transform .15s, border-color .15s}
.soc:hover,.soc:focus-visible{transform:translateY(-2px); filter:brightness(1.08); outline:none}
.soc.tt{background:#010101; border-color:#010101; color:#fff; box-shadow:2px 2px 0 #25f4ee, -2px -2px 0 #fe2c55}
.soc.ig{background:linear-gradient(45deg,#f9a03f,#ee0e8e 50%,#7c3aed); border-color:transparent; color:#fff}
.soc.sc{background:#fffc00; border-color:#fffc00; color:#0e1f3d}
.soc svg{width:18px;height:18px}
.side{background:linear-gradient(170deg,var(--navy),var(--navy-2)); color:#fff; padding:34px 30px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px}
.qrwrap{background:#fff; padding:14px; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,.35); width:min(100%,260px)}
.qrwrap svg{display:block; width:100%; height:auto}
.qrmsg{color:var(--muted); font-size:13px; padding:20px 6px}
.side h2{font-family:"Fredoka","Nunito",sans-serif; font-weight:500; font-size:20px; margin:0}
.side p{margin:0; font-size:14px; line-height:1.45; color:#c9d6ee; max-width:26ch}
.btn{appearance:none; border:0; cursor:pointer; font:inherit; font-weight:800; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%; max-width:260px; padding:15px 22px; border-radius:16px; color:var(--navy); background:var(--yellow); box-shadow:0 6px 0 #c9b414; transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 #c9b414}
.btn:focus-visible{outline:3px solid #fff; outline-offset:3px}
.btn svg{width:20px;height:20px}
.status{min-height:18px; font-size:13px; color:#c9d6ee}
.status a{color:#fff}
@media (max-width:720px){
  body{padding:16px 12px; align-items:flex-start}
  .card{grid-template-columns:1fr; border-radius:26px}
  .main{padding:10px 22px 28px}
  .side{padding:28px 22px 30px}
  .logo{height:165px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var NL = "\r\n";
  function esc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
  var C = {
    first:"Muhamed", last:"Musawir", org:"TOYSEA", title:"Manager",
    tel:"+966542567535", email:"muhamedmusawirtoysea@gmail.com",
    links:[
      ["Location","https://maps.app.goo.gl/sshGhMk1AwKgcCLeA"],
      ["TikTok","https://www.tiktok.com/@toyseaksa"],
      ["Instagram","https://www.instagram.com/toyseaksa"],
      ["Snapchat","https://www.snapchat.com/add/toyseaksa"]
    ]
  };
  var L = [
    "BEGIN:VCARD","VERSION:3.0",
    "N:"+esc(C.last)+";"+esc(C.first)+";;;",
    "FN:"+esc(C.first+" "+C.last),
    "ORG:"+esc(C.org),
    "TITLE:"+esc(C.title),
    "TEL;TYPE=CELL,VOICE:"+C.tel,
    "EMAIL;TYPE=INTERNET,WORK:"+C.email
  ];
  C.links.forEach(function(l,i){
    var g="item"+(i+1);
    L.push(g+".URL:"+l[1]);
    L.push(g+".X-ABLabel:"+l[0]);
  });
  L.push("END:VCARD");
  var VCARD = L.join(NL)+NL;

  /* ---- QR (client-side) ---- */
  var qrEl = document.getElementById("qr");
  function drawQR(){
    try{
      var qr = qrcode(0,"M");
      qr.addData(VCARD,"Byte");
      qr.make();
      var n = qr.getModuleCount(), q = 2, size = n+q*2, d = "";
      for(var r=0;r<n;r++){
        for(var c=0;c<n;c++){
          if(qr.isDark(r,c)) d += "M"+(c+q)+" "+(r+q)+"h1v1h-1z";
        }
      }
      qrEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges"><rect width="'+size+'" height="'+size+'" fill="#fff"/><path d="'+d+'" fill="#0e1f3d"/></svg>';
    }catch(e){
      qrEl.innerHTML = '<div class="qrmsg">QR code could not be generated. Use Save Contact instead.</div>';
    }
  }
  if(window.qrcode){ drawQR(); }
  else { qrEl.innerHTML = '<div class="qrmsg">QR library could not load. Use Save Contact instead.</div>'; }

  /* ---- Save Contact (.vcf) ---- */
  var statusEl = document.getElementById("status");
  var FILE = "Muhamed-Musawir-TOYSEA.vcf";
  function say(t){ statusEl.textContent = t; }

  function plainDownload(){
    var blob = new Blob([VCARD],{type:"text/vcard;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = FILE; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    say("If no download started, scan the QR code instead.");
  }

  document.getElementById("save").addEventListener("click", async function(){
    say("");
    try{
      if(window.claude && typeof window.claude.use === "function"){
        var dl = await window.claude.use("downloads");
        if(dl){
          try{
            await dl.save({filename:FILE, data:VCARD});
            say("Contact file saved. Open it to add to Contacts.");
            return;
          }catch(err){
            if(err && err.code === "declined"){ return; }
          }
        }
      }
    }catch(e){}
    try{ plainDownload(); }
    catch(e){ say("Could not start the download. Please scan the QR code instead."); }
  });
})();
</script>
